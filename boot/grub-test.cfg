# Headless test boot config — used only by `make smoke` / `make test`.
# Boots straight into cloud/serial mode with no menu and no gfxterm, so it
# works under QEMU -nographic without hanging at a GRUB menu.
set timeout=0
set default=0
terminal_output console

menuentry "Lestra OS (test)" {
    multiboot2 /boot/kernel.bin cloud serial
    module2 /boot/initrd.img initrd
    boot
}
