# Copyright (c) 2026 lestramk.org / Lee Muriihi Kingori

set timeout=5
# Default to GUI Desktop — always boots to graphical mode
set default=0

# Colors
set menu_color_normal=cyan/blue
set menu_color_highlight=white/cyan

# Try to set graphics mode, but don't force it.
# VirtualBox needs "auto" as fallback, QEMU works with explicit mode.
# The kernel checks if the framebuffer tag is valid; if not, it falls
# back to text mode automatically.
set gfxmode=auto
insmod all_video
terminal_output gfxterm
# If gfxterm fails, fall back to console
if [ "${terminfo_output}" != "gfxterm" ]; then
    terminal_output console
fi

# GUI mode - tries VESA framebuffer, falls back to text shell if unavailable
menuentry "Lestra OS (GUI Desktop)" {
    multiboot2 /boot/kernel.bin gui
    module2 /boot/initrd.img initrd
    boot
}

# Legacy text mode - 80x25 VGA shell. Use this if GUI shows blank screen.
menuentry "Lestra OS (Legacy Text Shell)" {
    multiboot2 /boot/kernel.bin legacy
    module2 /boot/initrd.img initrd
    boot
}

# Recovery mode - drops straight to the shell, skips UI/splash
menuentry "Lestra OS (Recovery Shell)" {
    multiboot2 /boot/kernel.bin recovery single
    module2 /boot/initrd.img initrd
    boot
}

# Debug mode - GUI with debug logging
menuentry "Lestra OS (GUI + Debug Logging)" {
    multiboot2 /boot/kernel.bin gui debug
    module2 /boot/initrd.img initrd
    boot
}

menuentry "System Information" {
    echo "Lestra OS by Lee Muriihi Kingori"
    echo "lestramk.org - Version 1.0.0-alpha"
    echo ""
    echo "If GUI shows blank screen, use Legacy Text Shell instead."
    echo "VirtualBox users: enable 3D acceleration in VM settings for"
    echo "best graphics compatibility."
    echo ""
    lsmmap
}
